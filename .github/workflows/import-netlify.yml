name: Import Mechanics Lab from current Netlify deployment
on:
  push:
    branches:
      - migrate-mechanics-lab-github-pages
    paths:
      - .github/workflows/import-netlify.yml
permissions:
  contents: write
jobs:
  import-current-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migrate-mechanics-lab-github-pages
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch current live site and remove hosting-only markup
        run: node scripts/import-live-netlify.mjs
      - name: Commit imported app to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "Already imported"; exit 0; }
          git commit -m "Import current Mechanics Lab application from Netlify"
          git push origin HEAD:migrate-mechanics-lab-github-pages
