name: Audit live A Level Mechanics Lab
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit-netlify.mjs
